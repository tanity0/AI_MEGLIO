name: Deploy static (public/) to GitHub Pages

# §48.3: サーバー前提の機能を無効化した「静的モード」で public/ をそのまま公開する。
# Node ビルドは無し。actions/configure-pages の自動有効化（enablement）は GITHUB_TOKEN の
# 権限で拒否されたため（Resource not accessible by integration）、gh-pages ブランチへ
# 内容を push する方式にする（gh-pages ブランチの作成で Pages が自動有効化される）。

# 公開サイト（gh-pages）は claude/autosprite-clone-m0a7wv ブランチ1本から配信する。
#
# 経緯: このブランチと claude/autosprite-clone-m0a7wv の両方に同じ公開ワークフローが
# あり、どちらも peaceiris/actions-gh-pages の force_orphan で同じ gh-pages を
# 丸ごと置き換えていた。そのため公開サイトが「最後に push した側の版」になり、
# 2026-11-21 は v2.25.1（このブランチ）と v2.90.0（autosprite-clone）の間で
# 入れ替わって、一方で直した不具合が他方の公開で元に戻る状態だった。
#
# push での自動公開はやめ、手動実行だけ残す。このブランチを公開したいときは
# Actions から workflow_dispatch で実行する（その時点で公開サイトは
# このブランチの内容に置き換わる点に注意）。
# ユーザー承認: 2026-11-21
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy public/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
