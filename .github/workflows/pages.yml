name: Deploy static (public/) to GitHub Pages

# §48.3: サーバー前提の機能を無効化した「静的モード」で public/ をそのまま公開する。
# Node ビルドは無し。actions/configure-pages の自動有効化（enablement）は GITHUB_TOKEN の
# 権限で拒否されたため（Resource not accessible by integration）、gh-pages ブランチへ
# 内容を push する方式にする（gh-pages ブランチの作成で Pages が自動有効化される）。

on:
  push:
    branches: [claude/ai-asset-refinement-preview-c7o6va]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy public/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
