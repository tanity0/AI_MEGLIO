name: Deploy static (public/) to GitHub Pages

# §48.3: サーバー前提の機能を無効化した「静的モード」で public/ をそのまま公開する。
# Node ビルドは無し（public/ を artifact 化してそのまま Pages にデプロイ）。

on:
  push:
    branches: [claude/ai-asset-refinement-preview-c7o6va]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
